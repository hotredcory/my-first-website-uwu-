<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 - Page Not Found</title>
<style>
  :root {
    --bg-light: #fdf6ec;
    --bg-dark: #1c1512;
    --card-light: #ffffff;
    --card-dark: #2a201b;
    --text-light: #3b2a20;
    --text-dark: #f3e6d8;
    --accent: #a45c28;
    background: var(--bg-light);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      background: var(--bg-dark);
    }
  }
  :root[data-theme="dark"] { background: var(--bg-dark); }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    color: var(--text-light);
    background: var(--bg-light);
    text-align: center;
    padding: 24px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body {
      color: var(--text-dark);
      background: var(--bg-dark);
    }
  }
  :root[data-theme="dark"] body {
    color: var(--text-dark);
    background: var(--bg-dark);
  }

  .card {
    background: var(--card-light);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card { background: var(--card-dark); }
  }
  :root[data-theme="dark"] .card { background: var(--card-dark); }

  h1 {
    font-size: 2.2rem;
    margin: 0 0 8px;
  }

  p.sub {
    font-size: 1.05rem;
    opacity: 0.8;
    margin: 0 0 24px;
  }

  .tung-frame {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 24px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    background: #eee;
  }

  .tung-frame img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
  }

  .error-code {
    display: inline-block;
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: var(--accent);
    background: rgba(164,92,40,0.12);
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  a.home-link {
    display: inline-block;
    margin-top: 8px;
    padding: 10px 22px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    transition: opacity 0.15s ease;
  }
  a.home-link:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <span class="error-code">ERROR 404</span>
    <h1>uh oh, this page not found 🫠</h1>
    <p class="sub">but hey, at least tung showed up</p>
    <div class="tung-frame">
      <img src="tung.png" alt="Tung Tung Sahur" onerror="this.closest('.tung-frame').style.display='none'">
    </div>
    <a class="home-link" href="/">take me home</a>
  </div>
</body>
</html>
